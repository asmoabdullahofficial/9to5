<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <main class="blogfeed">
      {% include header.html %}

      <section id="article">
        <div style="max-width: 800px; margin: 20px auto 0; padding: 0 20px;">
          
          <a href="{{site.baseurl}}/" style="color: #4ade80; text-decoration: none; font-size: 12px; font-weight: bold; letter-spacing: 1px;">← BACK TO HOME</a>

          <div class="article-content" style="
            margin: 30px 0; 
            padding: 45px 40px; 
            background: linear-gradient(145deg, #161616, #0d0d0d); 
            border: 1px solid #333; 
            border-radius: 22px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          ">
            
            <style>
              .article-content h1 {
                color: #ffeb3b !important;     /* Bright Neon Yellow */
                font-size: 2.6em;
                margin-bottom: 28px;
                padding-bottom: 15px;
                border-bottom: 3px solid #4ade80;
              }
              .article-content h2 {
                color: #ffeb3b !important;     /* Bright Neon Yellow */
                font-size: 1.75em;
                margin: 42px 0 18px 0;
              }
              .article-content h3 {
                color: #4ade80 !important;
                font-size: 1.4em;
                margin: 32px 0 14px 0;
              }
              .article-content p {
                font-size: 1.12rem;
                line-height: 1.88;
                color: #eaeaea;
                margin-bottom: 24px;
              }
              .article-content strong { color: #fff; }
            </style>

            {{ content }}

          </div>
        </div>
      </section>

      {% include footer.html %}
    </main>

    {% include category-modal.html %}
    {% include chatbot.html %}
  </body>
</html>
