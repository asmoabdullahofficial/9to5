<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <main class="blogfeed">
      {% include header.html %}

      <section id="article">
        <div style="max-width: 800px; margin: 20px auto 0; padding: 0 20px;">
          
          <!-- Back to Home (post.html er moto) -->
          <a href="{{site.baseurl}}/" style="color: #4ade80; text-decoration: none; font-size: 12px; font-weight: bold; letter-spacing: 1px;">← BACK TO HOME</a>

          <!-- Lyrics-style beautiful content box -->
          <div class="article-content" style="margin: 30px 0; padding: 35px; background: linear-gradient(145deg, #161616, #0d0d0d); border: 1px solid #333; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);">
            
            {{ content }}

          </div>

        </div>
      </section>

      {% include footer.html %}
    </main>

    {% include category-modal.html %}
    {% include chatbot.html %}
  </body>
</html>
