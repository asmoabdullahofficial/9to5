<header class="custom-header">
  <div class="header-content">
    <a href="{{ site.baseurl }}/" class="logo">{{ site.title }}</a>
    <nav>
      <ul class="nav-links">
        <li><a href="{{ site.baseurl }}/about/">About</a></li>
        <li><a href="{{ site.baseurl }}/contact/">Contact</a></li>
        <li><a href="{{ site.baseurl }}/#article">Lyrics</a></li>
        <li><a href="{{ site.baseurl }}/#article">Stories</a></li>
        <li><a href="{{ site.baseurl }}/">Home</a></li>
      </ul>
    </nav>
  </div>
</header>

<style>
  .custom-header {
    background-color: #1a1110; 
    padding: 20px 0;
    border-bottom: 1px solid rgba(255, 180, 171, 0.1); 
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  .header-content {
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 25px;
  }
  .logo {
    color: #ffb4ab;
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .nav-links {
    list-style: none;
    display: flex;
    gap: 18px;
    margin: 0;
    padding: 0;
  }
  .nav-links a {
    color: #e6e1e0; 
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    transition: 0.4s ease;
    opacity: 0.7;
  }
  .nav-links a:hover {
    color: #ffb4ab;
    opacity: 1;
  }
  
  @media (max-width: 600px) {
    .header-content {
      flex-direction: column;
      gap: 12px;
    }
    .nav-links {
      gap: 12px;
    }
    .nav-links a {
      font-size: 0.7rem;
    }
  }
</style>
