{% if page.layout == "post" %}
<header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
    <a class="site-title article-page" href="{{site.baseurl}}/">{{site.title}}</a>

    <!-- Search Bar -->
    <div class="relative w-80 md:w-96 mx-4">
      <input 
        id="global-search"
        type="text" 
        placeholder="Search song or lyrics..."
        class="w-full bg-zinc-800 border border-zinc-700 focus:border-purple-500 rounded-3xl px-5 py-3 outline-none text-white placeholder-zinc-400 text-sm">
      <div id="search-results" class="absolute top-full mt-2 w-full bg-zinc-900 border border-zinc-700 rounded-3xl shadow-2xl max-h-96 overflow-auto z-50 hidden"></div>
    </div>

    <a href="https://x.com/asmoabdullah" target="_blank" class="text-3xl">𝕏</a>
  </div>
</header>
{% else %}
<header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
    <a class="site-title" href="{{site.baseurl}}/">{{site.title}}</a>

    <!-- Search Bar -->
    <div class="relative w-80 md:w-96 mx-4">
      <input 
        id="global-search"
        type="text" 
        placeholder="Search song or lyrics..."
        class="w-full bg-zinc-800 border border-zinc-700 focus:border-purple-500 rounded-3xl px-5 py-3 outline-none text-white placeholder-zinc-400 text-sm">
      <div id="search-results" class="absolute top-full mt-2 w-full bg-zinc-900 border border-zinc-700 rounded-3xl shadow-2xl max-h-96 overflow-auto z-50 hidden"></div>
    </div>

    <a href="https://x.com/asmoabdullah" target="_blank" class="text-3xl">𝕏</a>
  </div>
</header>
{% endif %}
