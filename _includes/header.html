{% if page.layout == "post" %}
<header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <a class="site-title article-page" href="{{site.baseurl}}/">{{site.title}}</a>
      
      <nav class="hidden md:flex items-center gap-4">
        <a href="{{site.baseurl}}/" style="background: #18181b; color: #4ade80; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 1px; padding: 8px 20px; border-radius: 50px; border: 1px solid #27272a; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3);" onmouseover="this.style.background='#4ade80'; this.style.color='#000'" onmouseout="this.style.background='#18181b'; this.style.color='#4ade80'">HOME</a>
        <a href="{{site.baseurl}}/#articles" style="background: #18181b; color: #fff; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 1px; padding: 8px 20px; border-radius: 50px; border: 1px solid #27272a; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3);" onmouseover="this.style.background='#4ade80'; this.style.color='#000'" onmouseout="this.style.background='#18181b'; this.style.color='#fff'">POSTS</a>
        <a href="{{site.baseurl}}/merch/" style="background: #18181b; color: #fff; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 1px; padding: 8px 20px; border-radius: 50px; border: 1px solid #27272a; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3);" onmouseover="this.style.background='#4ade80'; this.style.color='#000'" onmouseout="this.style.background='#18181b'; this.style.color='#fff'">MERCH</a>
      </nav>
    </div>

    <div class="relative w-80 md:w-96 mx-4">
      <input id="global-search" type="text" placeholder="Search song or lyrics..." class="w-full bg-zinc-800 border border-zinc-700 focus:border-purple-500 rounded-3xl px-5 py-3 outline-none text-white placeholder-zinc-400 text-sm">
      <div id="search-results" class="absolute top-full mt-2 w-full bg-zinc-900 border border-zinc-700 rounded-3xl shadow-2xl max-h-96 overflow-auto z-50 hidden"></div>
    </div>

    <a href="https://x.com/asmoabdullah" target="_blank" class="text-3xl" style="text-decoration: none; color: white;">𝕏</a>
  </div>
</header>
{% else %}
